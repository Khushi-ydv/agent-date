services:
  - type: web
    name: proxy-hearts
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
